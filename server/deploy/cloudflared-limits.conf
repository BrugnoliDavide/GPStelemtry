# Limiti di risorse per cloudflared (il Pi è condiviso con altri servizi).
# Installazione:
#   sudo install -D -m 0644 cloudflared-limits.conf /etc/systemd/system/cloudflared.service.d/limits.conf
#   sudo systemctl daemon-reload && sudo systemctl restart cloudflared
[Service]
Environment=GOMAXPROCS=2
Environment=GOMEMLIMIT=60MiB
MemoryHigh=80M
MemoryMax=128M
CPUQuota=25%
Nice=10
